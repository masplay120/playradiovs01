<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estacion Mix</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* =========================
HTML / BODY TRANSPARENTE
========================= */

html,
body{
width:100%;
height:100%;
background:transparent !important;
overflow:hidden;
font-family:'Poppins',sans-serif;
display:flex;
justify-content:center;
align-items:center;
padding:0;
margin:0;
}

/* =========================
PLAYER
========================= */

#player{
position:relative;
width:100%;
height:100%;
max-height:350px;
background: linear-gradient(180deg, rgba(47,113,132,.88), rgba(21,84,106,.88));
backdrop-filter:blur(12px);
padding:8px;
border-radius:0px; /* Removido para que acople mejor en iframes limpios, cámbialo a 8px si deseas bordes redondeados */
overflow:hidden;
box-shadow: 0 0 20px rgba(0,0,0,.3);
display: flex;
flex-direction: column;
justify-content: space-between;
}

/* =========================
BG BLUR
========================= */

#bgBlur{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
filter:blur(35px);
transform:scale(1.4);
opacity:.45;
z-index:1;
transition:1.5s;
}

/* =========================
OVERLAY
========================= */

#overlay{
position:absolute;
inset:0;
background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55));
z-index:2;
}

/* =========================
CONTENT
========================= */

#content{
position:relative;
z-index:5;
height: 100%;
display: flex;
flex-direction: column;
justify-content: space-between;
}

/* =========================
IMAGE CONTAINER
========================= */

#imageContainer{
position:relative;
width:100%;
height:110px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background-size:cover;
background-position:center;
border-radius:4px;
}

/* =========================
BLUR DETRAS DE IMAGEN
========================= */

#imageContainer::before{
content:"";
position:absolute;
inset:0;
background:inherit;
background-size:cover;
background-position:center;
filter:blur(25px);
transform:scale(1.3);
opacity:.65;
z-index:1;
}

/* =========================
IMAGE
========================= */

#artistImage{
position:relative;
z-index:5;
width:100%;
height:100%;
object-fit:contain;
padding:6px;
transition: opacity 1.5s ease, transform 8s ease;
filter: drop-shadow(0 0 20px rgba(0,0,0,.45));
}

/* =========================
EFECTOS
========================= */

.effect-zoom{ transform:scale(1.08); }
.effect-slide-left{ transform: scale(1.05) translateX(-10px); }
.effect-slide-right{ transform: scale(1.05) translateX(10px); }
.effect-slide-up{ transform: scale(1.05) translateY(-10px); }
.effect-rotate{ transform: scale(1.05) rotate(1deg); }
.effect-fade{ opacity:.92; }

/* =========================
BOTTOM BAR
========================= */

#bottomBar{
display:flex;
align-items:center;
padding:6px 4px;
gap:12px;
}

/* =========================
PLAY
========================= */

#playBtn{
width:46px;
height:46px;
border:none;
border-radius:50%;
background:#fff;
color:#1b5d72;
font-size:20px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
transition:.3s;
flex-shrink:0;
box-shadow: 0 0 15px rgba(255,255,255,.25);
}

#playBtn:hover{
transform:scale(1.05);
}

/* =========================
INFO
========================= */

#info{
flex:1;
overflow:hidden;
}

/* =========================
SONG
========================= */

#songTitle{
font-size:15px;
font-weight:700;
color:#fff;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:2px;
text-shadow: 0 0 10px rgba(0,0,0,.35);
}

/* =========================
ARTIST
========================= */

#artistName{
font-size:12px;
color:#ddd;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* =========================
VOLUME
========================= */

#volumeControl{
width:75px;
appearance:none;
height:4px;
background: rgba(255,255,255,.3);
border-radius:20px;
outline:none;
cursor:pointer;
}

#volumeControl::-webkit-slider-thumb{
appearance:none;
width:12px;
height:12px;
background:#fff;
border-radius:50%;
box-shadow: 0 0 10px rgba(255,255,255,.4);
}

/* =========================
LIVE
========================= */

#live{
position:absolute;
top:8px;
left:8px;
z-index:10;
background:#ff0033;
padding:3px 8px;
border-radius:20px;
font-size:9px;
font-weight:700;
color:#fff;
letter-spacing:1px;
box-shadow: 0 0 10px rgba(255,0,51,.5);
}

/* =========================
HISTORY SECTION
========================= */

#historySection {
padding: 1px;
height: 115px;
overflow: hidden;
display: flex;
flex-direction: column;
}

#historyList {
display: flex;
gap: 14px;
overflow-x: auto;
height: 100%;
align-items: flex-start;
scroll-behavior: smooth;
padding-bottom: 10px;
}

/* Ocultar barra de scroll en navegadores modernos pero permitir arrastre */
#historyList::-webkit-scrollbar {
height: 5px;
}
#historyList::-webkit-scrollbar-thumb {
background: rgba(255,255,255,0.2);
border-radius: 4px;
}

</style>
</head>

<body>

<div id="player">

    <div id="bgBlur"></div>

    <div id="overlay"></div>

    <div id="content">

        <div id="imageContainer">
            <div id="live">LIVE</div>
            <img id="artistImage" src="https://picsum.photos/900/600?random=1" alt="Artist">
        </div>

        <div id="bottomBar">
            <button id="playBtn">▶</button>
            <div id="info">
                <div id="songTitle">Cargando canción...</div>
                <div id="artistName">EstacionMix Radio</div>
            </div>
            <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
        </div>

        <div id="historySection">
            <div style="color:#fff; font-size:12px; font-weight:bold; margin-bottom:5px;">Últimos temas</div>
            <div id="historyList"></div>
        </div>

    </div>

    <audio id="audioPlayer" preload="auto">
        <source src="https://listen.openstream.co/6502/audio" type="audio/mpeg">
    </audio>

</div>

<script>

/* RADIO API */
const apiURL = 'https://api.laut.fm/station/estacionmix/current_song';

/* ELEMENTOS */
const songTitle = document.getElementById('songTitle');
const artistName = document.getElementById('artistName');
const artistImage = document.getElementById('artistImage');
const bgBlur = document.getElementById('bgBlur');
const imageContainer = document.getElementById('imageContainer');
const audioPlayer = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const volumeControl = document.getElementById('volumeControl');

/* PLAY */
playBtn.addEventListener('click', () => {
    if(audioPlayer.paused){
        audioPlayer.play();
        playBtn.innerHTML = '❚❚';
    } else {
        audioPlayer.pause();
        playBtn.innerHTML = '▶';
    }
});

/* VOLUMEN */
volumeControl.addEventListener('input', () => {
    audioPlayer.volume = volumeControl.value;
});

/* CAMBIAR IMAGEN */
function setImage(image){
    const effects = [
        'effect-zoom',
        'effect-slide-left',
        'effect-slide-right',
        'effect-slide-up',
        'effect-rotate',
        'effect-fade'
    ];
    
    const effect = effects[Math.floor(Math.random() * effects.length)];

    artistImage.className = '';
    artistImage.src = image;
    bgBlur.style.backgroundImage = `url(${image})`;
    imageContainer.style.backgroundImage = `url(${image})`;

    setTimeout(() => {
        artistImage.classList.add(effect);
    }, 100);
}

/* OBTENER CARATULA */
async function getArtistImage(artist, song){
    try {
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist + ' ' + song)}&media=music&limit=5`);
        const data = await response.json();
        if(data.results && data.results.length > 0){
            return data.results.map(r => r.artworkUrl100.replace('100x100','900x900'));
        }
        return null;
    } catch(error) {
        console.log(error);
        return null;
    }
}

/* SLIDESHOW */
let slideInterval;
async function startSlideshow(artist, song){
    clearInterval(slideInterval);
    const covers = await getArtistImage(artist, song);

    if(covers && covers.length > 0){
        let count = 0;
        slideInterval = setInterval(() => {
            const cover = covers[Math.floor(Math.random() * covers.length)];
            setImage(cover);
            count++;
        }, 10000);
        setImage(covers[0]);
    } else {
        setImage('https://picsum.photos/900/600?random=1');
    }
}

/* ACTUALIZAR CANCIÓN ACTUAL */
async function updateSong(){
    try {
        const response = await fetch(apiURL, { cache: 'no-store' });
        const song = await response.json();
        if(song && song.title){
            const titulo = song.title;
            const attachments = song.artist?.name ? song.artist.name : 'Artista desconocido';
            
            // Solo actualiza e inicia slideshow si cambió el tema para evitar saltos bruscos
            if(songTitle.textContent !== titulo) {
                songTitle.textContent = titulo;
                artistName.textContent = attachments;
                startSlideshow(attachments, titulo);
            }
        }
    } catch(error) {
        console.log(error);
    }
}

updateSong();
setInterval(updateSong, 30000);

/* HISTORIAL DE TEMAS */
const historyAPI = 'https://api.laut.fm/station/estacionmix/last_songs';
const imageCache = {};

async function cover(a, t){
    const k = a + '-' + t;
    if(imageCache[k]) return imageCache[k];
    try {
        let r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(a+' '+t)}&media=music&limit=1`);
        let d = await r.json();
        let u = d.results?.length ? d.results[0].artworkUrl100.replace('100x100','200x200') : 'https://picsum.photos/200';
        imageCache[k] = u;
        return u;
    } catch(e) {
        return 'https://picsum.photos/200';
    }
}

async function updateHistory(){
    try {
        let r = await fetch(historyAPI, { cache: 'no-store' });
        let songs = await r.json();
        let c = document.getElementById('historyList');
        
        // CORRECCIÓN: Limpiamos la lista antes de insertar los elementos nuevos actualizados
        c.innerHTML = '';
        
        for(let s of songs.slice(0, 10)){
            let art = s.artist?.name || 'Desconocido';
            let ttl = s.title || 'Tema';
            let img = await cover(art, ttl);
            
            c.innerHTML += `
                <div style="min-width:65px; max-width:65px; color:#fff; font-size:10px; text-align:center; flex-shrink:0;">
                    <img src="${img}" style="width:50px; height:50px; border-radius:6px; display:block; margin:auto; object-fit:cover; box-shadow: 0 2px 5px rgba(0,0,0,0.3)">
                    <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; margin-top:3px;">${art}</div>
                    <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ddd; font-size:9px;">${ttl}</div>
                </div>`;
        }
    } catch(e) {
        console.log(e);
    }
}

updateHistory();
setInterval(updateHistory, 30000);

</script>

</body>
</html>
